<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 312" width="900" role="img" aria-label="5G lab: what changed after hardening" font-family="Helvetica, Arial, sans-serif"><title>5G lab: what changed after hardening</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker></defs><rect width="900" height="312" fill="#ffffff"/><text x="450" y="30" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle" >5G lab: what changed after hardening</text><text x="40" y="58" font-size="12" font-weight="700" fill="#52606d" text-anchor="start" >Question</text><text x="380" y="58" font-size="12" font-weight="700" fill="#b42318" text-anchor="start" >Default configuration (baseline)</text><text x="640" y="58" font-size="12" font-weight="700" fill="#1a7f4b" text-anchor="start" >Hardened</text><rect x="30" y="68" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="91" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >Subscriber identity on the radio link</text><text x="380" y="91" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >SUCI null scheme, MSIN readable</text><text x="640" y="91" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >ECIES profile A, nothing readable</text><rect x="30" y="112" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="135" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >NAS ciphering selected by the AMF</text><text x="380" y="135" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >5G-EA0 (no encryption)</text><text x="640" y="135" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >5G-EA2</text><rect x="30" y="156" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="179" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >Core control plane in the capture</text><text x="380" y="179" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >90 readable HTTP/2 frames, SUPIs exposed</text><text x="640" y="179" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >0 readable, 89 TLS records</text><rect x="30" y="200" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="223" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >Unauthorised gNB</text><text x="380" y="223" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >Accepted (NG Setup completes)</text><text x="640" y="223" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >AMF never sees it</text><rect x="30" y="244" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="267" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >Ping from one slice to the other</text><text x="380" y="267" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >Succeeds</text><text x="640" y="267" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >100% packet loss</text><text x="40" y="302" font-size="10.5" font-weight="400" fill="#52606d" text-anchor="start" >Measured with tshark on the captures in this repository. Single runs on a laptop.</text></svg>