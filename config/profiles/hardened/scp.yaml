logger:
  path:
    file: /opt/open5gs/var/log/open5gs/scp.log
global: null
scp:
  sbi:
    server:
    - port: 443
      address: scp.localdomain
    client:
      nrf:
      - uri: https://nrf.localdomain
  default:
    tls:
      server:
        scheme: https
        private_key: /opt/open5gs/etc/open5gs/tls/scp.key
        cert: /opt/open5gs/etc/open5gs/tls/scp.crt
        verify_client: true
        verify_client_cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
      client:
        scheme: https
        cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
        client_private_key: /opt/open5gs/etc/open5gs/tls/scp.key
        client_cert: /opt/open5gs/etc/open5gs/tls/scp.crt
