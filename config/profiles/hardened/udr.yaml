db_uri: mongodb://mongo/open5gs
logger:
  path:
    file: /opt/open5gs/var/log/open5gs/udr.log
global: null
udr:
  sbi:
    server:
    - port: 443
      address: udr.localdomain
    client:
      nrf:
      - uri: https://nrf.localdomain
  default:
    tls:
      server:
        scheme: https
        private_key: /opt/open5gs/etc/open5gs/tls/udr.key
        cert: /opt/open5gs/etc/open5gs/tls/udr.crt
        verify_client: true
        verify_client_cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
      client:
        scheme: https
        cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
        client_private_key: /opt/open5gs/etc/open5gs/tls/udr.key
        client_cert: /opt/open5gs/etc/open5gs/tls/udr.crt
