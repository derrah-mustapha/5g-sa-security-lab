logger:
  path:
    file: /opt/open5gs/var/log/open5gs/nrf.log
global: null
nrf:
  serving:
  - plmn_id:
      mcc: 999
      mnc: 70
  sbi:
    server:
    - port: 443
      address: nrf.localdomain
  default:
    tls:
      server:
        scheme: https
        private_key: /opt/open5gs/etc/open5gs/tls/nrf.key
        cert: /opt/open5gs/etc/open5gs/tls/nrf.crt
        verify_client: true
        verify_client_cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
      client:
        scheme: https
        cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
        client_private_key: /opt/open5gs/etc/open5gs/tls/nrf.key
        client_cert: /opt/open5gs/etc/open5gs/tls/nrf.crt
