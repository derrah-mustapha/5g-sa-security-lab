logger:
  path:
    file: /opt/open5gs/var/log/open5gs/amf.log
global: null
amf:
  sbi:
    server:
    - port: 443
      address: amf.localdomain
    client:
      nrf:
      - uri: https://nrf.localdomain
  ngap:
    server:
    - address: 10.10.2.12
  metrics:
    server:
    - port: 9090
      address: 10.10.1.12
  guami:
  - plmn_id:
      mcc: 999
      mnc: 70
    amf_id:
      region: 2
      set: 1
  tai:
  - plmn_id:
      mcc: 999
      mnc: 70
    tac: 1
  plmn_support:
  - plmn_id:
      mcc: 999
      mnc: 70
    s_nssai:
    - sst: 1
    - sst: 2
  security:
    integrity_order:
    - NIA2
    - NIA1
    ciphering_order:
    - NEA2
    - NEA1
  network_name:
    full: Open5GS
    short: Next
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540
  default:
    tls:
      server:
        scheme: https
        private_key: /opt/open5gs/etc/open5gs/tls/amf.key
        cert: /opt/open5gs/etc/open5gs/tls/amf.crt
        verify_client: true
        verify_client_cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
      client:
        scheme: https
        cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
        client_private_key: /opt/open5gs/etc/open5gs/tls/amf.key
        client_cert: /opt/open5gs/etc/open5gs/tls/amf.crt
